version: 2

project_name: bourbaki

before:
  hooks:
    - go mod download

builds:
  - id: bourbaki
    main: ./cmd/bourbaki
    binary: bourbaki
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/tamnd/bourbaki-solver.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64

archives:
  - id: default
    ids:
      - bourbaki
    name_template: "bourbaki_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: linux-packages
    package_name: bourbaki
    ids:
      - bourbaki
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: tamnd
    homepage: https://github.com/tamnd/bourbaki-solver
    maintainer: Duc-Tam Nguyen <tamnd87@gmail.com>
    description: Build a tagged, multilingual Markdown corpus from the Bourbaki volumes.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils
    # poppler is not optional. Reading a born-digital volume is pdftohtml,
    # rendering a scan is pdftoppm, and classifying either is pdfinfo and
    # pdfimages. A package without them installs a binary that cannot work.
    dependencies:
      - poppler-utils
    overrides:
      rpm:
        dependencies:
          - poppler-utils
      apk:
        dependencies:
          - poppler-utils
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/bourbaki/LICENSE

dockers_v2:
  - images:
      - ghcr.io/tamnd/bourbaki-solver
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Build a tagged, multilingual Markdown corpus from the Bourbaki volumes"
      org.opencontainers.image.url: "https://github.com/tamnd/bourbaki-solver"
      org.opencontainers.image.source: "https://github.com/tamnd/bourbaki-solver"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"

homebrew_casks:
  - name: bourbaki
    ids:
      - default
    repository:
      owner: tamnd
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Casks
    homepage: https://github.com/tamnd/bourbaki-solver
    description: Build a tagged, multilingual Markdown corpus from the Bourbaki volumes
    dependencies:
      - formula: poppler
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    commit_author:
      name: Duc-Tam Nguyen
      email: tamnd87@gmail.com

scoops:
  - ids:
      - default
    repository:
      owner: tamnd
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}'
    directory: bucket
    homepage: https://github.com/tamnd/bourbaki-solver
    description: Build a tagged, multilingual Markdown corpus from the Bourbaki volumes
    license: MIT
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    commit_author:
      name: Duc-Tam Nguyen
      email: tamnd87@gmail.com

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: tamnd
    name: bourbaki-solver
  draft: false
  prerelease: auto
